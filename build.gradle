plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = "v${mod_version}"
group = mod_group_id

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)
sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
        }
    }
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }

            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            workingDirectory project.file('run-server')
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}


repositories {
    mavenCentral()
    flatDir {
        dir 'libs'
    }

    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }

    maven {
        url = "https://maven.architectury.dev"
        content {
            includeGroup "dev.architectury"
        }
    }

    maven {
        url "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.5.0")) {
        jarJar.ranged(it, "[0.5.0,)")
    }
    runtimeOnly fg.deobf("curse.maven:catalogue-459701:4766090")
    runtimeOnly fg.deobf("curse.maven:configured-457570:5180900")
    runtimeOnly fg.deobf("curse.maven:jei-238222:6600311")
    runtimeOnly fg.deobf("curse.maven:jei-integration-265917:4999754")
    runtimeOnly fg.deobf("curse.maven:jade-324717:6855440")
    implementation fg.deobf("curse.maven:rubidium-extra-654373:6101745")
    implementation fg.deobf("curse.maven:collective-342584:6429218")
    implementation fg.deobf("curse.maven:starter-kit-390717:6429851")

    implementation fg.deobf("curse.maven:lightmans-currency-472521:7697348")

    runtimeOnly fg.deobf("dev.latvian.mods:kubejs-forge:2001.6.5-build.16")
    runtimeOnly fg.deobf("dev.latvian.mods:rhino-forge:2001.2.3-build.10")
    runtimeOnly fg.deobf("dev.architectury:architectury-forge:9.2.14")

    implementation fg.deobf("curse.maven:modern-ui-352491:6199942")

    runtimeOnly fg.deobf("curse.maven:embeddium-908741:5681725")
    implementation fg.deobf("curse.maven:chloride-931925:6504509")

    implementation fg.deobf("curse.maven:curios-309927:6418456")

    implementation fg.deobf("curse.maven:armourers-workshop-229523:6965580")
    implementation fg.deobf("curse.maven:timeless-and-classics-zero-1028108:7401617")
    compileOnly fg.deobf("curse.maven:timeless-and-classics-zero-1028108:7401617")
    runtimeOnly fg.deobf("curse.maven:tacz-lesraisins-tactical-equipements-1273094:6751092")
    runtimeOnly fg.deobf("curse.maven:playeranimator-658587:4587214")
    runtimeOnly fg.deobf("curse.maven:cloth-config-348521:5729105")

    runtimeOnly fg.deobf("curse.maven:superb-warfare-1218165:7292685")
    runtimeOnly fg.deobf("curse.maven:geckolib-388172:6920925")

    runtimeOnly fg.deobf("curse.maven:caelus-308989:5281700")

}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('setupServer') {
    group = 'custom'
    description = 'Sets up the server run directory with eula.txt and server.properties'

    doLast {
        file('run-server').mkdirs()
        file('run-server/eula.txt').text = 'eula=true'
        file('run-server/server.properties').text = '''
allow-flight=true
enable-command-block=true
gamemode=creative
online-mode=false
spawn-protection=0
'''.stripIndent().trim()
    }
}

tasks.matching { it.name == 'runServer' }.configureEach {
    dependsOn 'setupServer'
}
